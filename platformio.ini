[env:waveshare_esp32_s3_touch_lcd_7]
board = waveshare_esp32_s3_touch_lcd_7
framework = arduino
platform = https://github.com/platformio/platform-espressif32.git#develop
debug_speed = 115200
lib_deps = 
	https://github.com/esp-arduino-libs/ESP32_Display_Panel@^1.0.5
	esp-arduino-libs/esp-lib-utils@^0.3.0
	https://github.com/esp-arduino-libs/ESP32_IO_Expander
